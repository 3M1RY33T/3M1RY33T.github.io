title: <%= q("SITE_TITLE", "Your Name") %>
description: <%= q("SITE_DESCRIPTION", "Your portfolio and blog description.") %>
baseurl: <%= q("SITE_BASEURL", "") %>
url: <%= q("SITE_URL", "https://your-username.github.io") %>
markdown: kramdown
permalink: /:categories/:year/:month/:day/:title.html
paginate: 5
paginate_path: "/blog/page:num"
exclude:
  - ".venv"
  - "_site"
  - ".env"
  - ".env.*"
  - "_config.template.yml"
  - "docs"
  - "node_modules"
  - ".playwright-mcp"
  - "vendor"
  - "Gemfile"
  - "Gemfile.lock"
collections:
  posts:
    output: true
  projects:
    output: true
    permalink: /projects/:name/
defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
  - scope:
      path: ""
      type: "projects"
    values:
      layout: "project"

# Public frontend endpoint. Do not put secret keys here.
likes:
  endpoint: <%= q("LIKES_ENDPOINT", "") %>

# Public frontend comments endpoint. Do not put admin keys here.
comments:
  endpoint: <%= q("COMMENTS_ENDPOINT", comments_endpoint_default) %>

nav:
  - title: "Home"
    url: "/"
  - title: "Blog"
    url: "/blog/"

name: Deploy Jekyll Site to Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Render Jekyll config
        env:
          SITE_TITLE: ${{ vars.SITE_TITLE || secrets.SITE_TITLE }}
          SITE_DESCRIPTION: ${{ vars.SITE_DESCRIPTION || secrets.SITE_DESCRIPTION }}
          SITE_BASEURL: ${{ vars.SITE_BASEURL || secrets.SITE_BASEURL }}
          SITE_URL: ${{ vars.SITE_URL || secrets.SITE_URL }}
          LIKES_ENDPOINT: ${{ vars.LIKES_ENDPOINT || secrets.LIKES_ENDPOINT }}
          CUSDIS_APP_ID: ${{ vars.CUSDIS_APP_ID || secrets.CUSDIS_APP_ID }}
          CUSDIS_HOST: ${{ vars.CUSDIS_HOST || secrets.CUSDIS_HOST }}
        run: ruby scripts/render_config.rb _config.yml

      - name: Verify rendered config
        run: |
          ruby -e '
            config = File.read("_config.yml")
            abort("LIKES_ENDPOINT was not rendered") unless config.match?(/endpoint:\s+".+"/)
            abort("CUSDIS_APP_ID was not rendered") unless config.match?(/app_id:\s+".+"/)
            puts "Rendered likes endpoint and Cusdis app ID into _config.yml"
          '

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Build with Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

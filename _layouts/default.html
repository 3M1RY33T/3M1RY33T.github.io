<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#111827" />
    <title>{{ page.title | default: site.title }}</title>
    <meta name="description" content="{{ page.excerpt | strip_html | strip_newlines | default: site.description }}">
    <link rel="icon" href="/assets/svg/favicon.svg" type="image/svg+xml" />
    <link rel="mask-icon" href="/assets/svg/favicon.svg" color="#2563eb" />
    <link rel="stylesheet" href="/assets/css/style.css" />
  </head>
  <body>
    <header class="site-header">
      <div class="container header-inner">
        <input class="nav-toggle" type="checkbox" id="nav-toggle" aria-label="Toggle navigation menu">
        <label class="nav-toggle-label" for="nav-toggle" aria-hidden="true">
          <span></span>
          <span></span>
          <span></span>
        </label>
        <nav class="site-nav">
          <a href="/">Home</a>
          <a href="/#projects">Projects</a>
          <a href="/#skills">Skills</a>
          <a href="/blog/">Blog</a>
          <a href="/#contact">Contact</a>
        </nav>
      </div>
    </header>

    <main class="container{% if page.url == '/blog/' %} blog-container{% endif %}">
      {{ content }}
    </main>

    <footer class="site-footer">
      <p>© {{ "now" | date: "%Y" }} Yigit Yildiz (3M1RY33T) · Built with GitHub Pages</p>
    </footer>
    <script>
      const likesEndpoint = "{{ site.likes.endpoint | default: '' | escape }}";
      const configuredCommentsEndpoint = "{{ site.comments.endpoint | default: '' | escape }}";
      const commentsEndpoint = configuredCommentsEndpoint || likesEndpoint.replace(/\/likes$/, "/comments");

      document.querySelectorAll("[data-featured-blog]").forEach((section) => {
        const items = Array.from(section.querySelectorAll("[data-featured-item]"));
        const triggers = Array.from(section.querySelectorAll("[data-featured-trigger]"));
        const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
        let activeIndex = 0;
        let cycleTimer;

        if (items.length < 2 || triggers.length < 2) return;

        const setActivePost = (nextIndex) => {
          activeIndex = nextIndex;
          items.forEach((item, index) => {
            item.classList.toggle("is-active", index === activeIndex);
          });
          triggers.forEach((trigger, index) => {
            trigger.classList.toggle("is-active", index === activeIndex);
            trigger.setAttribute("aria-pressed", String(index === activeIndex));
          });
        };

        const startCycle = () => {
          if (reduceMotion) return;
          window.clearInterval(cycleTimer);
          cycleTimer = window.setInterval(() => {
            setActivePost((activeIndex + 1) % items.length);
          }, 6000);
        };

        const stopCycle = () => {
          window.clearInterval(cycleTimer);
        };

        triggers.forEach((trigger, index) => {
          trigger.addEventListener("click", () => {
            setActivePost(index);
            startCycle();
          });
        });

        section.addEventListener("mouseenter", stopCycle);
        section.addEventListener("mouseleave", startCycle);
        section.addEventListener("focusin", stopCycle);
        section.addEventListener("focusout", (event) => {
          if (!section.contains(event.relatedTarget)) startCycle();
        });

        startCycle();
      });

      if (likesEndpoint) {
        const likeButtons = Array.from(document.querySelectorAll("[data-like-button]"));
        const likedStoragePrefix = "portfolio-liked:";

        const normalizeLikePath = (value) => {
          const rawPath = String(value || "").trim();
          if (!rawPath) return "";

          try {
            return new URL(rawPath, window.location.origin).pathname || rawPath;
          } catch (error) {
            return rawPath;
          }
        };

        const normalizeCount = (value) => {
          const count = Number(value);
          return Number.isFinite(count) && count >= 0 ? count : 0;
        };

        const setLikeButton = (button, count, liked) => {
          const countElement = button.querySelector("[data-like-count]");
          if (countElement) countElement.textContent = String(normalizeCount(count));
          button.classList.toggle("is-liked", liked);
          button.setAttribute("aria-pressed", String(liked));
          button.disabled = liked;
        };

        const setLikeButtonsForPath = (path, count, liked) => {
          likeButtons.forEach((button) => {
            if (button.dataset.normalizedPath === path) {
              setLikeButton(button, count, liked);
            }
          });
        };

        const getLiked = (path) => {
          try {
            return window.localStorage.getItem(`${likedStoragePrefix}${path}`) === "true";
          } catch (error) {
            return false;
          }
        };

        const setLiked = (path, liked = true) => {
          try {
            if (liked) {
              window.localStorage.setItem(`${likedStoragePrefix}${path}`, "true");
            } else {
              window.localStorage.removeItem(`${likedStoragePrefix}${path}`);
            }
          } catch (error) {
            // Likes still work without localStorage; this only prevents repeat clicks per browser.
          }
        };

        const requestLikes = async (path, options = {}) => {
          const url = new URL(likesEndpoint);
          url.searchParams.set("path", path);
          const response = await fetch(url, {
            headers: {
              Accept: "application/json",
            },
            ...options,
          });

          if (!response.ok) throw new Error("Unable to update likes.");
          return response.json();
        };

        likeButtons.forEach(async (button) => {
          const path = normalizeLikePath(button.dataset.path);
          if (!path) return;
          button.dataset.normalizedPath = path;

          const liked = getLiked(path);
          setLikeButton(button, 0, liked);

          try {
            const payload = await requestLikes(path);
            setLikeButton(button, payload.count, getLiked(path));
          } catch (error) {
            button.disabled = true;
            button.title = "Likes are unavailable right now.";
          }

          button.addEventListener("click", async () => {
            if (getLiked(path)) return;

            const currentCount = normalizeCount(button.querySelector("[data-like-count]")?.textContent);
            setLiked(path);
            setLikeButtonsForPath(path, currentCount + 1, true);

            try {
              const payload = await requestLikes(path, { method: "POST" });
              setLikeButtonsForPath(path, payload.count, true);
            } catch (error) {
              setLiked(path, false);
              setLikeButtonsForPath(path, currentCount, false);
              button.title = "Your like could not be saved right now.";
            }
          });
        });
      }

      document.querySelectorAll("[data-toronto-time]").forEach((timeElement) => {
        const timeFormatter = new Intl.DateTimeFormat([], {
          timeZone: "America/Toronto",
          hour: "numeric",
          minute: "2-digit",
        });
        const dateFormatter = new Intl.DateTimeFormat([], {
          timeZone: "America/Toronto",
          weekday: "long",
          month: "long",
          day: "numeric",
        });
        const contactTime = timeElement.closest(".contact-time");
        const dateElement = contactTime?.querySelector("[data-toronto-date]");
        const periodElement = contactTime?.querySelector("[data-toronto-period]");
        const timeWrapper = timeElement.closest("time");

        const updateTorontoTime = () => {
          const now = new Date();
          const formattedTime = timeFormatter.format(now)
            .replace(/\ba\.m\./i, "AM")
            .replace(/\bp\.m\./i, "PM");
          const timeMatch = formattedTime.match(/^(.+?)\s*(AM|PM)$/i);
          timeElement.textContent = timeMatch ? timeMatch[1] : formattedTime;
          if (periodElement) periodElement.textContent = timeMatch ? timeMatch[2].toUpperCase() : "";
          if (timeWrapper) timeWrapper.dateTime = now.toISOString();
          if (dateElement) dateElement.textContent = `${dateFormatter.format(now)} · Toronto, ON`;
        };

        updateTorontoTime();
        window.setInterval(updateTorontoTime, 10000);
      });

      document.querySelectorAll("[data-feed-post]").forEach((post) => {
        const content = post.querySelector("[data-feed-post-content]");
        const button = post.querySelector("[data-show-more]");
        const actions = post.querySelector(".feed-post-actions");

        if (!content || !button) return;

        const mediaItems = [];
        const hiddenMediaElements = new Set();
        const isSliderImage = (image) => {
          const source = image.currentSrc || image.src || image.getAttribute("src") || "";
          const path = source.split("?")[0].split("#")[0].toLowerCase();
          return /\.(avif|gif|jpe?g|png|webp)$/.test(path);
        };

        content.querySelectorAll("img").forEach((image) => {
          if (image.closest(".feed-post-media")) return;
          if (!isSliderImage(image)) return;

          mediaItems.push({
            alt: image.alt || "",
            caption: image.getAttribute("title") || image.dataset.caption || "",
            src: image.currentSrc || image.src || image.getAttribute("src") || "",
          });

          const slider = image.closest("[data-post-slider]");
          const figure = image.closest("figure");
          const paragraph = image.closest("p");
          const wrapper = slider || figure || (
            paragraph && paragraph.textContent.trim() === "" && paragraph.querySelectorAll("img").length === 1
              ? paragraph
              : image
          );

          hiddenMediaElements.add(wrapper);
        });

        hiddenMediaElements.forEach((element) => {
          element.classList.add("feed-post-inline-media");
        });

        if (mediaItems.length === 1 && actions) {
          const item = mediaItems[0];
          const media = document.createElement("figure");
          media.className = "feed-post-media feed-post-single-media";

          const mediaFrame = document.createElement("div");
          mediaFrame.className = "post-slider-media";

          const image = document.createElement("img");
          image.src = item.src;
          image.alt = item.alt;
          image.loading = "lazy";
          mediaFrame.append(image);
          media.append(mediaFrame);

          if (item.caption) {
            const figcaption = document.createElement("figcaption");
            figcaption.textContent = item.caption;
            media.append(figcaption);
          }

          content.before(media);
        } else if (mediaItems.length > 1 && actions) {
          const media = document.createElement("figure");
          media.className = "feed-post-media";
          media.dataset.postSlider = "";
          media.setAttribute("aria-label", `${post.querySelector("h2")?.textContent || "Post"} media`);
          media.tabIndex = 0;

          mediaItems.forEach((item) => {
            if (!item.src) return;
            const image = document.createElement("img");
            image.src = item.src;
            image.alt = item.alt;
            image.loading = "lazy";
            if (item.caption) image.title = item.caption;
            media.append(image);
          });

          content.before(media);
        }

        const canExpand = content.scrollHeight > content.clientHeight + 4;
        if (!canExpand) {
          button.hidden = true;
          content.classList.add("has-no-overflow");
          return;
        }

        button.addEventListener("click", () => {
          const isExpanded = post.classList.toggle("is-expanded");
          button.textContent = isExpanded ? "Show less" : "Show more";
          button.setAttribute("aria-expanded", String(isExpanded));
        });
      });

      document.querySelectorAll("[data-post-slider]").forEach((slider) => {
        const buildSliderFromImages = () => {
          if (slider.querySelector("[data-slider-slide]")) return;

          const images = Array.from(slider.querySelectorAll("img"));
          if (images.length === 0) return;

          const viewport = document.createElement("div");
          viewport.className = "post-slider-viewport";

          const track = document.createElement("div");
          track.className = "post-slider-track";
          track.dataset.sliderTrack = "";

          images.forEach((image, index) => {
            const slide = document.createElement("div");
            slide.className = "post-slider-slide";
            slide.dataset.sliderSlide = "";
            slide.hidden = index !== 0;

            const media = document.createElement("div");
            media.className = "post-slider-media";
            const clonedImage = image.cloneNode(true);
            clonedImage.loading = clonedImage.loading || "lazy";
            media.append(clonedImage);
            slide.append(media);

            const caption = image.getAttribute("title") || image.dataset.caption || "";
            if (caption) {
              const figcaption = document.createElement("figcaption");
              figcaption.textContent = caption;
              slide.append(figcaption);
            }

            track.append(slide);
          });

          const prevButton = document.createElement("button");
          prevButton.className = "post-slider-control post-slider-prev";
          prevButton.type = "button";
          prevButton.dataset.sliderPrev = "";
          prevButton.setAttribute("aria-label", "Previous image");
          prevButton.innerHTML = '<span aria-hidden="true"></span>';

          const nextButton = document.createElement("button");
          nextButton.className = "post-slider-control post-slider-next";
          nextButton.type = "button";
          nextButton.dataset.sliderNext = "";
          nextButton.setAttribute("aria-label", "Next image");
          nextButton.innerHTML = '<span aria-hidden="true"></span>';

          const footer = document.createElement("div");
          footer.className = "post-slider-footer";

          const dots = document.createElement("div");
          dots.className = "post-slider-dots";
          dots.dataset.sliderDots = "";
          dots.setAttribute("aria-label", `${slider.getAttribute("aria-label") || "Image gallery"} navigation`);

          const status = document.createElement("p");
          status.className = "post-slider-status";
          status.dataset.sliderStatus = "";
          status.setAttribute("aria-live", "polite");

          viewport.append(track, prevButton, nextButton);
          footer.append(dots, status);
          slider.classList.add("post-slider");
          if (!slider.hasAttribute("tabindex")) slider.tabIndex = 0;
          slider.replaceChildren(viewport, footer);
        };

        buildSliderFromImages();

        const slides = Array.from(slider.querySelectorAll("[data-slider-slide]"));
        const prevButton = slider.querySelector("[data-slider-prev]");
        const nextButton = slider.querySelector("[data-slider-next]");
        const dots = slider.querySelector("[data-slider-dots]");
        const status = slider.querySelector("[data-slider-status]");
        const viewport = slider.querySelector(".post-slider-viewport");
        let activeIndex = 0;

        if (slides.length === 0) return;

        const setActiveSlide = (nextIndex) => {
          activeIndex = (nextIndex + slides.length) % slides.length;
          slides.forEach((slide, index) => {
            slide.hidden = index !== activeIndex;
          });
          dots?.querySelectorAll("[data-slider-dot]").forEach((dot, index) => {
            const isActive = index === activeIndex;
            dot.classList.toggle("is-active", isActive);
            dot.setAttribute("aria-current", isActive ? "true" : "false");
          });
          if (status) {
            status.textContent = `${activeIndex + 1} of ${slides.length}`;
          }
        };

        if (slides.length < 2) {
          prevButton?.setAttribute("hidden", "");
          nextButton?.setAttribute("hidden", "");
          if (status) status.textContent = "1 of 1";
          return;
        }

        slides.forEach((slide, index) => {
          const dot = document.createElement("button");
          dot.className = "post-slider-dot";
          dot.type = "button";
          dot.dataset.sliderDot = String(index);
          dot.setAttribute("aria-label", `Show image ${index + 1}`);
          dot.addEventListener("click", () => setActiveSlide(index));
          dots?.append(dot);
        });

        prevButton?.addEventListener("click", () => setActiveSlide(activeIndex - 1));
        nextButton?.addEventListener("click", () => setActiveSlide(activeIndex + 1));

        if (viewport) {
          let dragStartX = 0;
          let dragStartY = 0;
          let dragCurrentX = 0;
          let dragPointerId = null;
          let isDragging = false;

          const resetDrag = () => {
            dragPointerId = null;
            isDragging = false;
            viewport.classList.remove("is-dragging");
          };

          viewport.addEventListener("pointerdown", (event) => {
            if (!event.isPrimary || event.target.closest("button")) return;

            dragPointerId = event.pointerId;
            dragStartX = event.clientX;
            dragStartY = event.clientY;
            dragCurrentX = event.clientX;
            isDragging = false;
            viewport.setPointerCapture?.(event.pointerId);
          });

          viewport.addEventListener("pointermove", (event) => {
            if (dragPointerId !== event.pointerId) return;

            dragCurrentX = event.clientX;
            const deltaX = dragCurrentX - dragStartX;
            const deltaY = event.clientY - dragStartY;

            if (!isDragging && Math.abs(deltaX) < 10) return;
            if (!isDragging && Math.abs(deltaY) > Math.abs(deltaX)) {
              resetDrag();
              return;
            }

            isDragging = true;
            viewport.classList.add("is-dragging");
            event.preventDefault();
          });

          viewport.addEventListener("pointerup", (event) => {
            if (dragPointerId !== event.pointerId) return;

            const deltaX = dragCurrentX - dragStartX;
            const threshold = Math.max(44, viewport.clientWidth * 0.14);

            if (isDragging && Math.abs(deltaX) >= threshold) {
              setActiveSlide(activeIndex + (deltaX < 0 ? 1 : -1));
            }

            resetDrag();
          });

          viewport.addEventListener("pointercancel", resetDrag);
        }

        slider.addEventListener("keydown", (event) => {
          if (event.key === "ArrowLeft") setActiveSlide(activeIndex - 1);
          if (event.key === "ArrowRight") setActiveSlide(activeIndex + 1);
        });

        setActiveSlide(0);
      });

      document.querySelectorAll("[data-contact-form]").forEach((form) => {
        const status = form.querySelector("[data-contact-status]");
        const submitButton = form.querySelector("button[type='submit']");

        const setContactStatus = (message, isError = false) => {
          if (!status) return;
          status.textContent = message;
          status.classList.toggle("is-error", isError);
        };

        form.addEventListener("submit", async (event) => {
          event.preventDefault();

          const formData = new FormData(form);
          if (String(formData.get("_honey") || "").trim() !== "") return;

          const endpoint = form.action.replace("https://formsubmit.co/", "https://formsubmit.co/ajax/");
          setContactStatus("Sending your message...");
          if (submitButton) submitButton.disabled = true;

          try {
            const payload = Object.fromEntries(formData.entries());
            delete payload._honey;

            const response = await fetch(endpoint, {
              method: "POST",
              headers: {
                Accept: "application/json",
                "Content-Type": "application/json",
              },
              body: JSON.stringify(payload),
            });

            const result = await response.json().catch(() => ({}));
            if (!response.ok || result.success === false) {
              throw new Error(result.message || "Unable to send message.");
            }

            form.reset();
            setContactStatus("Thanks. Your message has been sent.");
          } catch (error) {
            setContactStatus("Your message could not be sent right now. Please email me directly.", true);
          } finally {
            if (submitButton) submitButton.disabled = false;
          }
        });
      });

      document.querySelectorAll("[data-worker-comments]").forEach((section) => {
        const draftForm = section.querySelector("[data-comment-draft-form]");
        const identityForm = section.querySelector("[data-comment-identity-form]");
        const modal = section.querySelector("[data-comment-modal]");
        const cancelButton = section.querySelector("[data-comment-cancel]");
        const status = section.querySelector("[data-comment-status]");
        const list = section.querySelector("[data-comment-list]");
        const contentField = draftForm?.elements.content;
        const nicknameField = identityForm?.elements.nickname;
        const sendButton = draftForm?.querySelector(".comment-send-button");
        let pendingContent = "";

        if (!commentsEndpoint || !draftForm || !identityForm || !modal || !list) return;

        const pageId = section.dataset.pageId;
        const pageUrl = section.dataset.pageUrl;
        const pageTitle = section.dataset.pageTitle;

        const resizeCommentField = () => {
          if (!contentField) return;
          contentField.style.height = "auto";
          contentField.style.height = `${contentField.scrollHeight}px`;
        };

        const updateSendButton = () => {
          if (!sendButton || !contentField) return;
          sendButton.disabled = contentField.value.trim() === "";
        };

        const setStatus = (message, isError = false) => {
          if (!status) return;
          status.textContent = message;
          status.classList.toggle("is-error", isError);
        };

        const openModal = () => {
          modal.hidden = false;
          document.body.classList.add("comment-modal-open");
          window.setTimeout(() => nicknameField?.focus(), 0);
        };

        const closeModal = () => {
          modal.hidden = true;
          document.body.classList.remove("comment-modal-open");
        };

        const formatCommentDate = (value) => {
          if (!value) return "";
          const date = new Date(value);
          if (Number.isNaN(date.getTime())) return "";
          return new Intl.DateTimeFormat([], {
            year: "numeric",
            month: "short",
            day: "numeric",
          }).format(date);
        };

        const makeComment = (comment) => {
          const item = document.createElement("article");
          item.className = "comment-item";

          const meta = document.createElement("p");
          meta.className = "comment-meta";
          const author = comment.authorName || "Anonymous";
          const createdAt = formatCommentDate(comment.createdAt);
          meta.textContent = createdAt ? `${author} · ${createdAt}` : author;

          const content = document.createElement("p");
          content.className = "comment-body";
          content.textContent = comment.content || "";

          item.append(meta, content);

          return item;
        };

        const loadComments = async () => {
          list.textContent = "Loading comments...";

          try {
            const url = new URL(commentsEndpoint);
            url.searchParams.set("path", pageId);

            const response = await fetch(url, {
              headers: {
                Accept: "application/json",
              },
            });

            if (!response.ok) throw new Error("Unable to load comments.");

            const payload = await response.json();
            const comments = payload?.comments || [];
            list.replaceChildren();

            if (comments.length === 0) {
              const empty = document.createElement("p");
              empty.className = "comment-empty";
              empty.textContent = "There are no comments for this post yet.";
              list.append(empty);
              return;
            }

            comments.forEach((comment) => list.append(makeComment(comment)));
          } catch (error) {
            list.textContent = "";
            setStatus("Comments could not load right now.", true);
          }
        };

        draftForm.addEventListener("submit", (event) => {
          event.preventDefault();
          pendingContent = contentField?.value.trim() || "";
          if (!pendingContent) return;
          setStatus("");
          openModal();
        });

        contentField?.addEventListener("input", () => {
          resizeCommentField();
          updateSendButton();
        });

        identityForm.addEventListener("submit", async (event) => {
          event.preventDefault();
          const formData = new FormData(identityForm);
          const submitButton = identityForm.querySelector("button[type='submit']");
          const nickname = String(formData.get("nickname") || "").trim();
          const email = String(formData.get("email") || "").trim();
          const website = String(formData.get("website") || "").trim();

          if (!nickname || !pendingContent) return;

          if (submitButton) submitButton.disabled = true;
          setStatus("Posting your comment...");

          try {
            const response = await fetch(commentsEndpoint, {
              method: "POST",
              headers: {
                Accept: "application/json",
                "Content-Type": "application/json",
              },
              body: JSON.stringify({
                path: pageId,
                pageUrl,
                pageTitle,
                content: pendingContent,
                nickname,
                email,
                website,
              }),
            });

            if (!response.ok) throw new Error("Unable to post comment.");

            pendingContent = "";
            draftForm.reset();
            resizeCommentField();
            updateSendButton();
            identityForm.reset();
            closeModal();
            setStatus("Thanks. Your comment is awaiting approval.");
            loadComments();
          } catch (error) {
            setStatus("Your comment could not be posted right now.", true);
          } finally {
            if (submitButton) submitButton.disabled = false;
          }
        });

        cancelButton?.addEventListener("click", closeModal);
        modal.addEventListener("click", (event) => {
          if (event.target === modal) closeModal();
        });

        loadComments();
        resizeCommentField();
        updateSendButton();
      });
    </script>
  </body>
</html>

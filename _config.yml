title: "Your Name"
description: "Your portfolio and blog description."
baseurl: ""
url: "https://your-username.github.io"
markdown: kramdown
permalink: /:categories/:year/:month/:day/:title.html
paginate: 5
paginate_path: "/blog/page:num"
exclude:
  - "Yigit_Yildiz_CV_Resume_2026.pdf"
  - ".venv"
  - "_site"
  - ".env"
  - ".env.*"
  - "_config.template.yml"
collections:
  posts:
    output: true
defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"

# Public frontend endpoint. Do not put secret keys here.
likes:
  endpoint: ""

# Public frontend comment app identifier. Do not put admin keys here.
cusdis:
  app_id: ""
  host: "https://cusdis.com"

nav:
  - title: "Home"
    url: "/"
  - title: "Blog"
    url: "/blog/"

<div class="project-tiles">
  {% assign tiles = site.projects | sort: "order" %}
  {% for p in tiles %}
  <a class="project-tile" href="{{ p.url }}">
    <span class="project-tile-media">
      {% if p.card.thumbnail %}
        <img src="{{ p.card.thumbnail }}" alt="" loading="lazy">
      {% else %}
        <span class="project-tile-monogram" aria-hidden="true">{{ p.title | slice: 0 }}</span>
      {% endif %}
    </span>
    <span class="project-tile-body">
      <strong class="project-tile-name">{{ p.title }}</strong>
      <span class="project-tile-tagline">{{ p.tagline }}</span>
      {% if p.stack %}
      <span class="project-chips">
        {% for s in p.stack limit: 3 %}<span>{{ s }}</span>{% endfor %}
      </span>
      {% endif %}
      <span class="project-tile-cta">View project</span>
    </span>
  </a>
  {% endfor %}
</div>
